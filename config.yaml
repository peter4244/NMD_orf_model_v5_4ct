# =============================================================================
# paths — inputs produced OUTSIDE this repo.
#
# These were hardcoded as absolute /projects/talisman/... literals in data_prep.py,
# export_rds.R, 09_export_polya.py and relabel_tx_summary_4ct.R. That is not a style
# problem: it silently pinned the model's ENTIRE isoform universe to one machine's copy
# of the legacy isopair tree. Measured 2026-07-26 -- 0 of 24 isoforms that the rebuilt
# structures.rds added appear in the model's tx_summary.tsv, so the published model was
# trained and explained on that stale universe without anything saying so.
#
# The defaults below are exactly those Channing (talisman) locations, so behaviour is
# unchanged where they exist. Override per-machine WITHOUT editing code:
#   env var      NMD_ISOPAIR_CACHE, NMD_ISOPAIR_DATA, NMD_SQANTI_CLASS, NMD_SQANTI_FASTA
#   or edit      this file
# Read by utils.resolve_path() (Python) and read_paths() in export_rds.R (R), so the two
# languages share one source rather than drifting.
paths:
  isopair_cache: /projects/talisman/shared-data/nmd/isoform_transitions/Version_6.0/isopair_wrapper/data_mashr/analysis_cache
  isopair_data:  /projects/talisman/shared-data/nmd/isoform_transitions/Version_6.0/isopair_wrapper/data_mashr
  sqanti_class:  /projects/talisman/shared-data/nmd/sqanti/results/nmd_lungcells_classification.txt
  sqanti_fasta:  /projects/talisman/shared-data/nmd/sqanti/results/nmd_lungcells_corrected.fasta
  mashr_dir:     /projects/talisman/shared-data/nmd/mashr

data:
  hdf5_path: results_4ct/nmd_orf_data.h5
  max_orfs_per_tx: 5
  window_size_atg: 100   # sweep over {100, 500, 1000}
  window_size_stop: 1000 # sweep over {100, 500, 1000, 2000}

model:
  n_seq_channels: 9       # v5: 4 nuc + junction + rolling GC + 3 frame position
  conv_channels: 32
  seq_embed_dim: 32
  n_orf_features: 5       # v5: frac_start, frac_stop, is_ref_cds, is_sqanti_cds, n_downstream_ejc
  orf_embed_dim: 64
  head_hidden: 32
  dropout_orf: 0.2
  dropout_head: 0.3

training:
  batch_size: 256
  lr: 0.001
  weight_decay_cnn: 0.001
  weight_decay_other: 0.0001
  epochs: 100
  patience: 10
  scheduler_patience: 5
  scheduler_factor: 0.5
  mixed_precision: true
  seed: 42
  overfit_gap_threshold: 0.05

slurm:
  partition: gpu
  gres: "gpu:1"
  time: "08:00:00"
  mem: "32G"
  cpus_per_task: 8
