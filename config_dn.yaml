# PATHS FOR THE DEPOSIT-NATIVE RUN.
#
# config_dn.yaml had NO paths block, so every consumer fell through to config.yaml -- whose
# defaults are absolute /projects/talisman/... locations, deliberately, so that behaviour is
# unchanged where they exist. In a clean room they do not exist, and data_prep.py stopped with
# "nmd_lungcells_corrected.fasta not found" while the file sat in the deposit all along.
#
# These are RELATIVE TO THIS FILE (paths_config.resolve_path anchors them there, as the R side
# always has), so the deposit-native config is not pinned to one machine. Environment variables
# still win, which is how a run against a different tree overrides without editing anything.
paths:
  sqanti_class:  ../data_deposit/source_data/sqanti/nmd_lungcells_classification.txt
  sqanti_fasta:  ../data_deposit/source_data/sqanti/nmd_lungcells_corrected.fasta

# WHICH CONFIGURATION WAS SELECTED — the single source of truth. See config.yaml for the
# full rationale; kept in step with it deliberately, since a deposit-native run that
# selected a different window config than the published one would be a silent confound.
selected:
  # RE-SELECTED ON THE DEPOSIT-NATIVE UNIVERSE, 2026-08-04. Pete's decision, and his rationale:
  # among the top performers on BOTH metrics, and a balanced window size.
  #
  # The 60-cell sweep (12 configurations x 5 paired seeds, scored on val_clean) ranks this
  # 3rd of 12 on AUC (0.93211) and 5th on AUPRC (0.81688), and it is inside BOTH simultaneous
  # 95% sets. Symmetric windows also mean the two heads see equal extents, rather than an
  # asymmetry that would confound a branch decomposition.
  #
  # WHAT THE SWEEP DID NOT DO, recorded here because the number alone would imply otherwise:
  # it did not identify a winner. Top-two spacing was 0.00179 on AUC and 0.00082 on AUPRC
  # against exclusion thresholds of 0.00484 and 0.01401 -- margins 3x to 17x below the noise
  # floor. Seven configurations are inseparable on AUC, ten on AUPRC, and the two metrics
  # disagree sharply: the AUC leader (atg1000_stop2000) is 8th on AUPRC and the AUPRC leader
  # (atg500_stop2000) is 6th on AUC. So this is a defensible choice among statistically
  # equivalent ones, not a measured optimum. collect_sweep.py says it plainly: whatever
  # tie-break is applied is what selects the configuration.
  #
  # The only real signal is negative: all four atg100_* configurations are last on both
  # metrics. A 100 nt start window is genuinely worse.
  #
  # SUPERSEDES atg500_stop500, which the manuscript reports. That selection was made on the
  # CHANNING universe (W307) -- the sweep behind it read an HDF5 built from Channing inputs --
  # and it ranks 8th on AUC here, outside that 95% set, 4th on AUPRC, inside it. Changing the
  # published configuration is a manuscript-level change and is Pete's and Yul's call (D50).
  window_size_atg: 1000
  window_size_stop: 1000

data:
  # REPOINTED 2026-08-04. results_4ct_dn held an HDF5 built from CHANNING inputs (the
  # driver omitted --config, so load_config defaulted to config.yaml and /projects/talisman
  # is mounted on Explorer, so it succeeded). That tree is under deprecated_2026-08-04/.
  # This one is deposit-native and says so in its own attrs: config_path, resolved inputs,
  # results_dir, code_sha256, build_complete.
  hdf5_path: results_deposit_h5_2026-08-04/nmd_orf_data.h5
  max_orfs_per_tx: 5
  # THE SWEEP GRID'S STARTING POINT, NOT THE SELECTION — see `selected:` above.
  window_size_atg: 100   # sweep over {100, 500, 1000}
  window_size_stop: 1000 # sweep over {100, 500, 1000, 2000}

model:
  n_seq_channels: 9       # v5: 4 nuc + junction + rolling GC + 3 frame position
  conv_channels: 32
  seq_embed_dim: 32
  n_orf_features: 5       # v5: frac_start, frac_stop, is_ref_cds, is_sqanti_cds, n_downstream_ejc
  orf_embed_dim: 64
  head_hidden: 32
  dropout_orf: 0.2
  dropout_head: 0.3

training:
  batch_size: 256
  lr: 0.001
  weight_decay_cnn: 0.001
  weight_decay_other: 0.0001
  epochs: 100
  patience: 10
  scheduler_patience: 5
  scheduler_factor: 0.5
  mixed_precision: true
  seed: 42
  overfit_gap_threshold: 0.05

slurm:
  partition: gpu
  gres: "gpu:1"
  time: "08:00:00"
  mem: "32G"
  cpus_per_task: 8
